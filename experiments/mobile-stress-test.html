<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiloCrop T-004 — Mobile 48 MP Memory &amp; Quality Stress Test</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#f8fafc; --muted:#94a3b8; --acc:#22c55e; --warn:#f59e0b; --err:#ef4444; --bd:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:14px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); max-width:720px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 6px; }
  p.sub { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin-bottom:6px; font-size:13px; }
  input[type=file], select, button { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--bd); background:#0b1220; color:var(--fg); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  button { cursor:pointer; font-weight:600; background:#1d4ed8; border-color:#2563eb; }
  button.sec { background:#0b1220; border-color:var(--bd); }
  button.ok { background:#15803d; border-color:#16a34a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .previews { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  .previews img { max-width:100%; border:1px solid var(--bd); border-radius:6px; background:#fff; display:block; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace,monospace; max-height:280px; overflow:auto; }
  .tag { display:inline-block; padding:2px 7px; border-radius:99px; font-size:11px; font-weight:700; margin-right:6px; }
  .pass { background:#14532d; color:#86efac; } .warn { background:#78350f; color:#fde68a; } .fail { background:#7f1d1d; color:#fca5a5; }
</style>
</head>
<body>
  <h1>KiloCrop T-004: Mobile Memory &amp; JPEG Quality Stress Test</h1>
  <p class="sub">Zero-network, single-file probe for iOS Safari 16.7 MP canvas caps, 2–4 GB Android OOMs, and native JPEG quality under 25 KB.</p>

  <div class="card">
    <label for="file">1. Pick a real 12–48 MP camera photo (or generate a synthetic 12 MP test photo):</label>
    <input id="file" type="file" accept="image/*">
    <div class="row">
      <button id="genBtn" type="button" class="sec">Synthetic 12 MP JPEG (4000×3000)</button>
      <select id="preset" aria-label="Target preset">
        <option value="unilorin">UNILORIN stress: 600×600 px, ≤ 25 KB</option>
        <option value="lasu">LASU tiny cap: 300×300 px, ≤ 20 KB</option>
        <option value="nysc">NYSC window: 200×200 px, 7–15 KB</option>
        <option value="nis">NIS online: 600×800 px, ≤ 200 KB</option>
      </select>
    </div>
    <div class="row">
      <button id="run1" type="button" disabled>Run 1×</button>
      <button id="run5" type="button" class="ok" disabled>Run 5× Sequential (OOM Check)</button>
    </div>
    <div class="row">
      <button id="copyBtn" type="button" class="sec" disabled>Copy Markdown Row for DEVICE_MATRIX.md</button>
      <button id="clearBtn" type="button" class="sec">Clear Log</button>
    </div>
  </div>

  <div class="card" id="summaryCard">
    <div id="statusBadge"><span class="tag warn">READY</span>Select or generate an image, then tap Run 5×.</div>
    <div class="meta" id="envInfo"></div>
  </div>

  <div class="card previews">
    <div>
      <label>2. Target JPEG Output (1:1 inspection)</label>
      <img id="outImg" alt="Encoded JPEG output preview">
      <div class="meta" id="outMeta">—</div>
    </div>
    <div>
      <label>3. 4×6 in (300 DPI) 8-up Sheet PNG</label>
      <img id="sheetImg" alt="4x6 print sheet preview">
      <div class="meta" id="sheetMeta">—</div>
    </div>
  </div>

  <div class="card">
    <label>4. Run Log (X-Ray, Path A/B, Binary Search, Heap)</label>
    <pre id="log">Waiting for input…</pre>
  </div>

<script>
(() => {
  const PRESETS = {
    unilorin: { label: "UNILORIN 600×600 ≤25KB", w: 600, h: 600, minKb: 0, maxKb: 25 },
    lasu:     { label: "LASU 300×300 ≤20KB",     w: 300, h: 300, minKb: 0, maxKb: 20 },
    nysc:     { label: "NYSC 200×200 7–15KB",    w: 200, h: 200, minKb: 7, maxKb: 15 },
    nis:      { label: "NIS 600×800 ≤200KB",     w: 600, h: 800, minKb: 0, maxKb: 200 }
  };
  const $ = (id) => document.getElementById(id);
  const fileEl = $("file"), presetEl = $("preset"), genBtn = $("genBtn");
  const run1Btn = $("run1"), run5Btn = $("run5"), copyBtn = $("copyBtn"), clearBtn = $("clearBtn");
  const logEl = $("log"), outImg = $("outImg"), sheetImg = $("sheetImg");
  const outMeta = $("outMeta"), sheetMeta = $("sheetMeta"), badgeEl = $("statusBadge"), envEl = $("envInfo");

  let activeFile = null, lastSummary = null, outUrl = null, sheetUrl = null;
  const memMb = () => performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB" : "n/a";
  const shortUa = navigator.userAgent.replace(/Mozilla\/5\.0\s*/, "").slice(0, 72);
  envEl.textContent = `UA: ${shortUa} | deviceMemory: ${navigator.deviceMemory ?? "n/a"} GB | cores: ${navigator.hardwareConcurrency ?? "n/a"} | heap: ${memMb()}`;

  const log = (msg) => { logEl.textContent += (logEl.textContent === "Waiting for input…" ? "" : "\n") + msg; logEl.scrollTop = logEl.scrollHeight; };
  const releaseCanvas = (c) => { if (!c) return; c.width = 1; c.height = 1; };
  const toBlob = (c, type, q) => new Promise((res, rej) => c.toBlob((b) => b ? res(b) : rej(new Error("toBlob null")), type, q));

  function inspectHeader(buf) {
    const dv = new DataView(buf), len = dv.byteLength;
    let kind = "unknown", sof = null, rawW = null, rawH = null, orientation = 1;
    if (len >= 12) {
      const m = dv.getUint32(0);
      if ((m >>> 8) === 0xFFD8FF) kind = "jpeg";
      else if (m === 0x89504E47) { kind = "png"; if (len >= 24) { rawW = dv.getUint32(16); rawH = dv.getUint32(20); } }
      else if (m === 0x52494646 && dv.getUint32(8) === 0x57454250) kind = "webp";
      else if (dv.getUint32(4) === 0x66747970) {
        const brand = String.fromCharCode(dv.getUint8(8), dv.getUint8(9), dv.getUint8(10), dv.getUint8(11));
        if (/^(heic|heix|mif1|msf1)$/.test(brand)) kind = "heic(" + brand + ")";
      }
    }
    if (kind === "jpeg") {
      let off = 2;
      while (off + 4 <= len) {
        if (dv.getUint8(off) !== 0xFF) break;
        const marker = dv.getUint8(off + 1);
        if (marker === 0xDA || marker === 0xD9) break;
        if (marker === 0x00 || (marker >= 0xD0 && marker <= 0xD8)) { off += 2; continue; }
        const segLen = dv.getUint16(off + 2);
        if (segLen < 2 || off + 2 + segLen > len) break;
        if (marker === 0xC0 || marker === 0xC2) {
          sof = marker === 0xC2 ? "SOF2(progressive)" : "SOF0(baseline)";
          if (segLen >= 7) { rawH = dv.getUint16(off + 5); rawW = dv.getUint16(off + 7); }
        } else if (marker === 0xE1 && segLen >= 16 && dv.getUint32(off + 4) === 0x45786966) {
          const tiff = off + 10, le = dv.getUint16(tiff) === 0x4949;
          const ifdOff = tiff + dv.getUint32(tiff + 4, le);
          if (ifdOff + 2 <= off + 2 + segLen) {
            const count = dv.getUint16(ifdOff, le);
            for (let i = 0; i < count; i++) {
              const e = ifdOff + 2 + i * 12;
              if (e + 12 > off + 2 + segLen) break;
              if (dv.getUint16(e, le) === 0x0112) { orientation = dv.getUint16(e + 8, le); break; }
            }
          }
        }
        off += 2 + segLen;
      }
    }
    return { kind, sof, rawW, rawH, orientation };
  }

  function sampleLuma(bmp, w, h) {
    const c = document.createElement("canvas"); c.width = 16; c.height = 16;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0, w, h, 0, 0, 16, 16);
    const d = ctx.getImageData(0, 0, 16, 16).data, out = new Uint8Array(256);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) out[p] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
    releaseCanvas(c);
    return out;
  }

  async function runSingle(file, p, iterIdx) {
    const t0 = performance.now();
    const headBuf = await file.slice(0, Math.min(file.size, 262144)).arrayBuffer();
    const xray = inspectHeader(headBuf);
    const rotated = xray.orientation >= 5 && xray.orientation <= 8;
    const rawOW = xray.rawW && xray.rawH ? (rotated ? xray.rawH : xray.rawW) : null;
    const rawOH = xray.rawW && xray.rawH ? (rotated ? xray.rawW : xray.rawH) : null;
    const mp = rawOW ? ((rawOW * rawOH) / 1e6).toFixed(1) : "?";
    if (iterIdx === 1) {
      log(`[X-Ray] ${file.name} | ${(file.size / 1048576).toFixed(2)} MB | ${xray.kind} | ${xray.sof ?? "-"} | raw=${xray.rawW ?? "?"}×${xray.rawH ?? "?"} (${mp} MP) | EXIF orient=${xray.orientation}`);
    }

    // Path A: downscale-first preview (<= 1600 px on long edge)
    const td = performance.now();
    const hint = rawOW && rawOH ? (rawOW >= rawOH ? { resizeWidth: Math.min(1600, rawOW) } : { resizeHeight: Math.min(1600, rawOH) }) : { resizeWidth: 1600 };
    const bmpA = await createImageBitmap(file, { imageOrientation: "from-image", ...hint });
    const decodeMs = performance.now() - td;

    const pw = bmpA.width, ph = bmpA.height, targetRatio = p.w / p.h;
    let cw = pw, ch = Math.round(pw / targetRatio);
    if (ch > ph) { ch = ph; cw = Math.round(ph * targetRatio); }
    const cx = Math.floor((pw - cw) / 2), cy = Math.floor((ph - ch) / 2);

    // Path A render to exact output canvas for quality & luminance check
    const cA = document.createElement("canvas"); cA.width = p.w; cA.height = p.h;
    cA.getContext("2d").drawImage(bmpA, cx, cy, cw, ch, 0, 0, p.w, p.h);
    const lumaA = sampleLuma(cA, p.w, p.h);
    bmpA.close();

    // Path B: crop-at-decode probe directly on original file
    let pathB = "skipped(no raw dims)";
    if (rawOW && rawOH) {
      let sw = rawOW, sh = Math.round(rawOW / targetRatio);
      if (sh > rawOH) { sh = rawOH; sw = Math.round(rawOH * targetRatio); }
      const sx = Math.floor((rawOW - sw) / 2), sy = Math.floor((rawOH - sh) / 2);
      let bmpB = null;
      try {
        bmpB = await createImageBitmap(file, sx, sy, sw, sh, { imageOrientation: "from-image", resizeWidth: p.w, resizeHeight: p.h });
        const lumaB = sampleLuma(bmpB, bmpB.width, bmpB.height);
        let diff = 0;
        for (let i = 0; i < 256; i++) diff += Math.abs(lumaA[i] - lumaB[i]);
        diff /= 256;
        pathB = (bmpB.width === p.w && bmpB.height === p.h && diff < 18) ? `MATCH (diff=${diff.toFixed(1)})` : `MISMATCH (${bmpB.width}×${bmpB.height}, diff=${diff.toFixed(1)})`;
      } catch (err) {
        pathB = `ERROR (${err.message})`;
      } finally {
        if (bmpB) bmpB.close();
      }
    }

    // Native JPEG binary search over q in [0.35, 0.95]
    const te = performance.now();
    let lo = 0.35, hi = 0.95, bestBlob = null, bestQ = 0.35, steps = 0;
    const maxBytes = p.maxKb * 1024, minBytes = p.minKb * 1024;
    while (steps < 7 && hi - lo > 0.015) {
      const q = (lo + hi) / 2;
      const b = await toBlob(cA, "image/jpeg", q);
      steps++;
      if (b.size <= maxBytes) { bestBlob = b; bestQ = q; lo = q; }
      else { hi = q; }
    }
    if (!bestBlob) bestBlob = await toBlob(cA, "image/jpeg", 0.35);
    if (minBytes > 0 && bestBlob.size < minBytes) {
      const bMax = await toBlob(cA, "image/jpeg", 1.0);
      if (bMax.size <= maxBytes) { bestBlob = bMax; bestQ = 1.0; }
    }
    const encodeMs = performance.now() - te;

    // 4x6 in (1200x1800 px) 300 DPI PNG sheet: 8 rotated 35x45mm tiles (531x413 px)
    const ts = performance.now();
    const sheet = document.createElement("canvas"); sheet.width = 1200; sheet.height = 1800;
    const sctx = sheet.getContext("2d");
    sctx.fillStyle = "#ffffff"; sctx.fillRect(0, 0, 1200, 1800);
    const tw = 531, th = 413, gap = 24;
    const ox = Math.floor((1200 - (2 * tw + gap)) / 2), oy = Math.floor((1800 - (4 * th + 3 * gap)) / 2);
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 2; c++) {
        const dx = ox + c * (tw + gap), dy = oy + r * (th + gap);
        sctx.save(); sctx.translate(dx + tw / 2, dy + th / 2); sctx.rotate(Math.PI / 2);
        sctx.drawImage(cA, -th / 2, -tw / 2, th, tw);
        sctx.restore();
        sctx.strokeStyle = "#cbd5e1"; sctx.lineWidth = 2; sctx.strokeRect(dx, dy, tw, th);
      }
    }
    const sheetBlob = await toBlob(sheet, "image/png");
    const sheetMs = performance.now() - ts;

    releaseCanvas(cA); releaseCanvas(sheet);
    const totalMs = performance.now() - t0;

    const kb = bestBlob.size / 1024;
    const flag = bestBlob.size > maxBytes ? "INFEASIBLE(>max)" : (minBytes > 0 && bestBlob.size < minBytes ? "BELOW-MIN(needs COM pad)" : "OK");
    log(`#${iterIdx}: decode=${decodeMs.toFixed(0)}ms | PathB=${pathB} | jpeg=${kb.toFixed(1)}KB q=${bestQ.toFixed(2)} (${steps} steps, ${encodeMs.toFixed(0)}ms) [${flag}] | sheet=${(sheetBlob.size / 1024).toFixed(0)}KB (${sheetMs.toFixed(0)}ms) | total=${totalMs.toFixed(0)}ms | heap=${memMb()}`);
    return { mp, decodeMs, encodeMs, sheetMs, totalMs, kb, q: bestQ, flag, pathB, outBlob: bestBlob, sheetBlob };
  }

  async function executeRuns(n) {
    if (!activeFile) return;
    run1Btn.disabled = run5Btn.disabled = copyBtn.disabled = genBtn.disabled = true;
    const p = PRESETS[presetEl.value];
    badgeEl.innerHTML = `<span class="tag warn">RUNNING ${n}×</span>${p.label}…`;
    log(`\n--- Running ${n}× (${p.label}) ---`);
    const results = [];
    try {
      for (let i = 1; i <= n; i++) {
        const r = await runSingle(activeFile, p, i);
        results.push(r);
        if (i === n) {
          if (outUrl) URL.revokeObjectURL(outUrl);
          if (sheetUrl) URL.revokeObjectURL(sheetUrl);
          outUrl = URL.createObjectURL(r.outBlob); sheetUrl = URL.createObjectURL(r.sheetBlob);
          outImg.src = outUrl; sheetImg.src = sheetUrl;
          outMeta.textContent = `${p.w}×${p.h} px · ${r.kb.toFixed(1)} KB · q=${r.q.toFixed(2)} · ${r.flag}`;
          sheetMeta.textContent = `1200×1800 px (300 DPI) · ${(r.sheetBlob.size / 1024).toFixed(0)} KB PNG · 8-up rotated`;
        }
        await new Promise((res) => setTimeout(res, 40));
      }
      const avgTotal = results.reduce((a, b) => a + b.totalMs, 0) / results.length;
      const last = results[results.length - 1];
      const ok = avgTotal <= 2000 && last.flag === "OK";
      badgeEl.innerHTML = `<span class="tag ${ok ? "pass" : "warn"}">${ok ? "PASS" : "CHECK"}</span>${n}× done · avg ${avgTotal.toFixed(0)} ms · ${last.kb.toFixed(1)} KB (${last.flag}) · Path B: ${last.pathB}`;
      lastSummary = { n, preset: p.label, mp: last.mp, avgTotal: avgTotal.toFixed(0), kb: last.kb.toFixed(1), q: last.q.toFixed(2), flag: last.flag, pathB: last.pathB };
      copyBtn.disabled = false;
    } catch (err) {
      badgeEl.innerHTML = `<span class="tag fail">FAIL</span>${err.message}`;
      log(`ERROR: ${err.stack || err.message}`);
    } finally {
      run1Btn.disabled = run5Btn.disabled = genBtn.disabled = false;
    }
  }

  fileEl.addEventListener("change", () => {
    activeFile = fileEl.files?.[0] || null;
    run1Btn.disabled = run5Btn.disabled = !activeFile;
    if (activeFile) badgeEl.innerHTML = `<span class="tag warn">LOADED</span>${activeFile.name} (${(activeFile.size / 1048576).toFixed(2)} MB)`;
  });

  genBtn.addEventListener("click", async () => {
    genBtn.disabled = true;
    badgeEl.innerHTML = `<span class="tag warn">GENERATING</span>Building synthetic 12 MP (4000×3000) JPEG…`;
    const c = document.createElement("canvas"); c.width = 4000; c.height = 3000;
    const ctx = c.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 4000, 3000);
    g.addColorStop(0, "#e2e8f0"); g.addColorStop(1, "#94a3b8");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 4000, 3000);
    ctx.fillStyle = "#475569"; ctx.beginPath(); ctx.arc(2000, 1200, 520, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1e293b"; ctx.fillRect(1400, 1850, 1200, 1150);
    ctx.fillStyle = "#fff"; ctx.font = "bold 96px sans-serif"; ctx.fillText("KILOCROP 12MP TEST", 1460, 1220);
    const blob = await toBlob(c, "image/jpeg", 0.92);
    releaseCanvas(c);
    activeFile = new File([blob], "synthetic-12mp.jpg", { type: "image/jpeg" });
    run1Btn.disabled = run5Btn.disabled = genBtn.disabled = false;
    badgeEl.innerHTML = `<span class="tag pass">READY</span>Synthetic 12 MP JPEG (${(activeFile.size / 1048576).toFixed(2)} MB)`;
  });

  run1Btn.addEventListener("click", () => executeRuns(1));
  run5Btn.addEventListener("click", () => executeRuns(5));
  clearBtn.addEventListener("click", () => { logEl.textContent = "Waiting for input…"; });
  copyBtn.addEventListener("click", async () => {
    if (!lastSummary) return;
    const row = `| Device/Browser | ${navigator.deviceMemory ?? "n/a"} GB | ${lastSummary.mp} MP | ${lastSummary.preset} | ${lastSummary.n}× PASS | ${lastSummary.avgTotal} ms | ${lastSummary.kb} KB (q=${lastSummary.q}) | ${lastSummary.pathB} | Inspect 1:1 visual? |`;
    try { await navigator.clipboard.writeText(row); copyBtn.textContent = "Copied!"; setTimeout(() => { copyBtn.textContent = "Copy Markdown Row for DEVICE_MATRIX.md"; }, 1500); }
    catch { log("\nMarkdown row:\n" + row); }
  });
})();
</script>
</body>
</html>
